<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ステージエディタ(開発者用)</title>
<style>
  :root {
    --bg: #14181c;
    --panel: #1c2228;
    --line: #2c343c;
    --ally: #4fb0e8;
    --enemy: #e8654f;
    --obstacle: #8a8f96;
    --text: #dfe6ec;
    --muted: #7c8a96;
    --accent: #e8c34f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Hiragino Sans", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 12px 40px;
  }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 16px; text-align: center; max-width: 520px; }
  .layout { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  .board-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  canvas { display: block; border-radius: 4px; background: #0f1215; cursor: crosshair; }
  .side-panel { width: 280px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

  .section-title { font-size: 11px; color: var(--muted); letter-spacing: 0.05em; border-bottom: 1px solid var(--line); padding-bottom: 6px; }

  .mode-grid { display: flex; flex-direction: column; gap: 6px; }
  .mode-btn { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line); background: #20262c; color: var(--text); cursor: pointer; font-size: 12.5px; }
  .mode-btn .shape { width: 12px; height: 12px; flex-shrink: 0; }
  .mode-btn.selected { border-color: var(--accent); background: #2b2a1e; }

  label { font-size: 11px; color: var(--muted); display: block; margin-bottom: 3px; }
  input[type=text], input[type=number], textarea {
    width: 100%;
    background: #0f1215;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 5px;
    padding: 7px 8px;
    font-size: 12.5px;
    font-family: inherit;
  }
  textarea { resize: vertical; }
  .field { margin-bottom: 8px; }
  .field-row { display: flex; gap: 8px; }
  .field-row .field { flex: 1; }

  .count-row { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); }

  button.action { appearance: none; border: 1px solid var(--line); background: #232a31; color: var(--text); padding: 9px 12px; border-radius: 6px; font-size: 12.5px; cursor: pointer; }
  button.action:hover { border-color: var(--accent); background: #2a323a; }
  button.primary { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 600; }
  button.primary:hover { background: #f2d266; }

  .export-box { display: none; flex-direction: column; gap: 8px; }
  .export-box.show { display: flex; }
  .export-box textarea { height: 140px; font-size: 10.5px; }
  .copy-status { font-size: 11px; color: var(--accent); min-height: 14px; }

  .legend { font-size: 11px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
</style>
</head>
<body>

<h1>ステージエディタ(開発者用)</h1>
<div class="subtitle">盤面をクリックして敵配置と障害物を作成し、JSONを書き出します。書き出したJSONを本編ゲームの「カスタムステージ読み込み」に貼り付けると反映されます。</div>

<div class="layout">
  <div class="board-wrap">
    <canvas id="board" width="480" height="480"></canvas>
  </div>

  <div class="side-panel">
    <div class="section-title">配置モード</div>
    <div class="mode-grid" id="modePicker"></div>

    <div class="section-title">ステージ情報</div>
    <div class="field">
      <label>ステージ名</label>
      <input type="text" id="fName" value="カスタムステージ">
    </div>
    <div class="field">
      <label>説明文</label>
      <input type="text" id="fDesc" value="自作の布陣。">
    </div>
    <div class="field-row">
      <div class="field">
        <label>目安人数(par)</label>
        <input type="number" id="fPar" value="8" min="1">
      </div>
      <div class="field">
        <label>ボーナス兵数</label>
        <input type="number" id="fBonus" value="6" min="0">
      </div>
    </div>
    <div class="field">
      <label>敵ステータス倍率</label>
      <input type="number" id="fMult" value="1.0" min="0.5" max="3" step="0.05">
    </div>

    <div class="count-row"><span>敵ユニット数</span><span id="enemyCount">0</span></div>
    <div class="count-row"><span>障害物数</span><span id="obstacleCount">0</span></div>

    <button id="clearBtn" class="action">全消去</button>
    <button id="exportBtn" class="action primary">JSONを書き出す</button>

    <div class="export-box" id="exportBox">
      <textarea id="exportText" readonly></textarea>
      <button id="copyBtn" class="action">コピーする</button>
      <div class="copy-status" id="copyStatus"></div>
    </div>

    <div class="legend">
      <div>● 物理 ▲ 遠距離 ◆ 魔法 ■ 障害物(通行不可)</div>
      <div>上段(赤みエリア): 敵ゾーン / 下段(青みエリア): 味方配置ゾーン。障害物はどこにでも置けます。</div>
    </div>
  </div>
</div>

<script>
const GRID = 20;
const CELL = 24;
const ALLY_ZONE_ROWS = [15,16,17,18,19];
const ENEMY_ZONE_ROWS = [0,1,2,3,4];

const MODES = {
  physical: { label: '物理を置く', shape: 'circle', color: '#e8654f' },
  ranged:   { label: '遠距離を置く', shape: 'triangle', color: '#e8654f' },
  magic:    { label: '魔法を置く', shape: 'diamond', color: '#e8654f' },
  obstacle: { label: '障害物を置く', shape: 'square', color: '#8a8f96' },
  eraser:   { label: '消しゴム', shape: 'x', color: '#dfe6ec' },
};
const MODE_KEYS = Object.keys(MODES);

let mode = 'physical';
let enemies = []; // {type, x, y}
let obstacles = []; // {x, y}

const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');

function shapeSvg(shape, color) {
  if (shape === 'circle') return `<svg width="12" height="12"><circle cx="6" cy="6" r="5" fill="${color}"/></svg>`;
  if (shape === 'triangle') return `<svg width="12" height="12"><polygon points="6,1 11,10 1,10" fill="${color}"/></svg>`;
  if (shape === 'diamond') return `<svg width="12" height="12"><polygon points="6,0 12,6 6,12 0,6" fill="${color}"/></svg>`;
  if (shape === 'square') return `<svg width="12" height="12"><rect x="1" y="1" width="10" height="10" fill="${color}"/></svg>`;
  return `<svg width="12" height="12"><line x1="1" y1="1" x2="11" y2="11" stroke="${color}" stroke-width="2"/><line x1="11" y1="1" x2="1" y2="11" stroke="${color}" stroke-width="2"/></svg>`;
}

function buildModePicker() {
  const wrap = document.getElementById('modePicker');
  wrap.innerHTML = '';
  for (const key of MODE_KEYS) {
    const m = MODES[key];
    const btn = document.createElement('button');
    btn.className = 'mode-btn' + (key === mode ? ' selected' : '');
    btn.innerHTML = `<span class="shape">${shapeSvg(m.shape, m.color)}</span>${m.label}`;
    btn.addEventListener('click', () => { mode = key; buildModePicker(); });
    wrap.appendChild(btn);
  }
}

function cellFree(x, y) {
  return !enemies.some(e => e.x === x && e.y === y) && !obstacles.some(o => o.x === x && o.y === y);
}

function removeAt(x, y) {
  enemies = enemies.filter(e => !(e.x === x && e.y === y));
  obstacles = obstacles.filter(o => !(o.x === x && o.y === y));
}

canvas.addEventListener('click', (e) => {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((e.clientX - rect.left) / CELL);
  const y = Math.floor((e.clientY - rect.top) / CELL);
  if (x < 0 || x >= GRID || y < 0 || y >= GRID) return;

  if (mode === 'eraser') {
    removeAt(x, y);
  } else if (mode === 'obstacle') {
    if (!cellFree(x, y)) removeAt(x, y);
    obstacles.push({ x, y });
  } else {
    if (!cellFree(x, y)) removeAt(x, y);
    enemies.push({ type: mode, x, y });
  }
  updateCounts();
  draw();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  enemies = [];
  obstacles = [];
  updateCounts();
  draw();
});

function updateCounts() {
  document.getElementById('enemyCount').textContent = enemies.length;
  document.getElementById('obstacleCount').textContent = obstacles.length;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.fillStyle = 'rgba(79,176,232,0.07)';
  for (const r of ALLY_ZONE_ROWS) ctx.fillRect(0, r*CELL, GRID*CELL, CELL);
  ctx.fillStyle = 'rgba(232,101,79,0.07)';
  for (const r of ENEMY_ZONE_ROWS) ctx.fillRect(0, r*CELL, GRID*CELL, CELL);

  ctx.strokeStyle = '#20262c';
  ctx.lineWidth = 1;
  for (let i = 0; i <= GRID; i++) {
    ctx.beginPath(); ctx.moveTo(i*CELL, 0); ctx.lineTo(i*CELL, GRID*CELL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i*CELL); ctx.lineTo(GRID*CELL, i*CELL); ctx.stroke();
  }

  ctx.fillStyle = '#8a8f96';
  for (const o of obstacles) {
    ctx.fillRect(o.x*CELL+3, o.y*CELL+3, CELL-6, CELL-6);
  }

  for (const en of enemies) {
    const cx = en.x*CELL + CELL/2;
    const cy = en.y*CELL + CELL/2;
    drawShape(en.type, cx, cy, '#e8654f');
  }
}

function drawShape(type, cx, cy, color) {
  const r = CELL*0.34;
  ctx.fillStyle = color;
  if (type === 'physical') {
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
  } else if (type === 'ranged') {
    ctx.beginPath();
    ctx.moveTo(cx, cy-r); ctx.lineTo(cx+r, cy+r*0.8); ctx.lineTo(cx-r, cy+r*0.8);
    ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(cx, cy-r); ctx.lineTo(cx+r, cy); ctx.lineTo(cx, cy+r); ctx.lineTo(cx-r, cy);
    ctx.closePath(); ctx.fill();
  }
}

document.getElementById('exportBtn').addEventListener('click', () => {
  const stage = {
    name: document.getElementById('fName').value || 'カスタムステージ',
    desc: document.getElementById('fDesc').value || '',
    par: parseInt(document.getElementById('fPar').value, 10) || 1,
    bonus: parseInt(document.getElementById('fBonus').value, 10) || 0,
    statMult: parseFloat(document.getElementById('fMult').value) || 1.0,
    obstacles: obstacles.map(o => ({ x: o.x, y: o.y })),
    enemies: enemies.map(e => ({ type: e.type, x: e.x, y: e.y })),
  };
  const json = JSON.stringify(stage, null, 2);
  document.getElementById('exportText').value = json;
  document.getElementById('exportBox').classList.add('show');
  document.getElementById('copyStatus').textContent = '';
});

document.getElementById('copyBtn').addEventListener('click', async () => {
  const text = document.getElementById('exportText');
  text.select();
  const status = document.getElementById('copyStatus');
  try {
    await navigator.clipboard.writeText(text.value);
    status.textContent = 'コピーしました。本編のカスタムステージ読み込み欄に貼り付けてください。';
  } catch (err) {
    status.textContent = '自動コピーできませんでした。テキストが選択されているので、Ctrl+C / Cmd+Cでコピーしてください。';
  }
});

buildModePicker();
updateCounts();
draw();
</script>
</body>
</html>
