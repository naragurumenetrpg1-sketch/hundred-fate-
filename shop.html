<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ショップ — The Hundred Fate</title>
<style>
  :root {
    --bg: #171009;
    --panel: #241a10;
    --panel-2: #2f2314;
    --line: #4a3a22;
    --muted: #a8926a;
    --accent: #e3b34a;
    --accent-light: #f0cf6e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(ellipse at top, #241a10 0%, var(--bg) 60%);
    color: #e9dfc8;
    font-family: "Hiragino Sans", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 16px 60px;
  }
  .back {
    align-self: flex-start;
    color: var(--muted); font-size: 13px; text-decoration: none;
    border: 1px solid var(--line); border-radius: 4px; padding: 7px 14px;
    margin-bottom: 24px;
  }
  .back:hover { color: var(--accent-light); border-color: var(--accent); }
  h1 {
    font-size: 20px; color: var(--accent-light); letter-spacing: .08em;
    margin: 40px 0 10px; text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }
  .note {
    color: var(--muted); font-size: 13px; text-align: center; max-width: 340px; line-height: 1.8;
  }
  .chest {
    width: 84px; height: 84px; margin-top: 24px; opacity: .5;
    border: 1px solid var(--line); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 34px; background: linear-gradient(160deg, var(--panel-2), var(--panel));
  }
</style>
</head>
<body>
  <a class="back" href="index.html">‹ 戻る</a>
  <div class="chest">🛒</div>
  <h1>ショップ</h1>
  <div class="note">現在準備中です。<br>所持金を使ってアイテムや強化を購入できるようになる予定です。</div>
</body>
</html>
